<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moldova refugee response: coordination</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<script>
  if (window.self !== window.top) document.documentElement.classList.add('embedded');
</script>
<style>
:root{
  --blue:#0072BC; --blue-dark:#05568B; --blue-darkest:#0B3754; --blue-02:#8FC1E1; --blue-01:#CDE3F1; --yellow:#FFC740;
  --ink:#242a2e; --ink-2:#4d565c; --ink-3:#5d676e;
  --page:#eef2f5; --card:#fff; --line:#e3e8ec; --line-strong:#cfd7dd;
  --gap:14px; --radius:10px; --shadow:0 2px 6px rgba(11,55,84,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--page);color:var(--ink);line-height:1.5;padding:var(--gap)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap)}
html.embedded,html.embedded body{height:100%;overflow:hidden}
html.embedded body{padding:0}
html.embedded .wrap{height:100%;max-width:none;overflow-y:auto;overscroll-behavior:auto;-webkit-overflow-scrolling:touch;padding:var(--gap);display:block}
html.embedded .wrap>*+*{margin-top:var(--gap)}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue-02);outline-offset:2px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:16px;font-weight:900;line-height:1.3}
.csub{font-size:13px;color:var(--ink-3);margin-top:2px}

/* Help banner */
.help{background:var(--blue);color:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.help img{display:block;height:36px;width:auto;max-width:100%}
.help p{font-size:14px;color:var(--blue-01);margin:10px 0 12px;line-height:1.4}
.help .btns{display:flex;flex-direction:column;gap:8px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;border-radius:8px;
  padding:11px 14px;font-weight:900;font-size:15px;line-height:1.2}
.btn small{display:block;font-weight:400;font-size:12px;margin-top:2px}
.btn.primary{background:var(--yellow);color:var(--blue-darkest)}
.btn.primary:hover{background:#ffd266}
.btn.secondary{background:transparent;color:#fff;border:1.5px solid var(--blue-02);font-weight:700;font-size:14px}
.btn.secondary:hover{background:var(--blue-dark)}
.btn .arr{font-size:18px;flex:none}

/* Calendar */
.cal-frame{position:relative;width:100%;height:0;padding-bottom:calc(100% * var(--cal-h,.5625) + 40px);margin-top:12px;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--line)}
.cal-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn-open{display:block;text-align:center;text-decoration:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--blue-01);color:var(--blue-darkest);font-weight:900;font-size:14px}
.btn-open:hover{background:var(--blue-02)}
.linkrow{margin-top:10px;font-size:13px;font-weight:700}

/* Coordination tree */
.tree{list-style:none;margin-top:12px}
.tree ul{list-style:none;margin:6px 0 0 14px;padding-left:12px;border-left:2px solid var(--blue-01)}
.tree li+li{margin-top:6px}
.tree ul>li{position:relative}
.tree ul>li::before{content:"";position:absolute;left:-12px;top:20px;width:10px;border-top:2px solid var(--blue-01)}
.node{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;color:var(--ink);
  background:var(--page);border:1px solid var(--line);border-left:4px solid var(--blue-02);border-radius:8px;
  padding:9px 10px;font-size:14px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.node:hover{background:var(--blue-01);border-color:var(--blue-02)}
.node .ext{color:var(--blue);font-size:13px;flex:none}
.node.root{background:var(--blue-darkest);border-color:var(--blue-darkest);color:#fff;font-size:15px;font-weight:900;border-left:4px solid var(--yellow)}
.node.root:hover{background:var(--blue-dark)}
.node.root .ext{color:var(--yellow)}
.node.wg{background:var(--blue-01);border-left-color:var(--blue);color:var(--blue-darkest)}
.node.wg:hover{background:#b9d6ea}
.node.sub{font-weight:400;background:#fff}
.node.sub:hover{background:var(--blue-01)}
.tree>li+li{margin-top:8px}
.tree-label{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.sep{border-top:1px dashed var(--line-strong);margin-top:14px;padding-top:14px}
.node.special{background:#fff;border-left-color:var(--yellow)}

/* RRP logo */
.logo-card{padding:12px 14px}
.logo-card img{display:block;width:100%;height:auto;max-width:420px;margin:0 auto}
.foot{font-size:12px;color:var(--ink-3);text-align:center;padding:2px 0 4px}
</style>
</head>
<body>
<main class="wrap">

  <section class="help" aria-label="UNHCR Help" id="help">
    <img src="assets/unhcr-help.svg" alt="UNHCR, the UN Refugee Agency">
    <p id="help-text"></p>
    <div class="btns" id="help-btns"></div>
  </section>

  <section class="card" aria-labelledby="cal-h" id="cal-card">
    <h2 id="cal-h"></h2>
    <p class="csub" id="cal-sub"></p>
    <div class="cal-frame"><iframe id="cal" title="Coordination calendar" loading="lazy" allowfullscreen></iframe></div>
    <a class="btn-open" id="cal-open" target="_blank" rel="noopener">Open the calendar full screen ↗</a>
  </section>

  <section class="card logo-card" aria-label="Regional Refugee Response for the Ukraine Situation, Government of the Republic of Moldova">
    <img src="assets/rrp-govt.jpg" alt="Government of the Republic of Moldova. Regional Refugee Response for the Ukraine Situation">
  </section>

  <section class="card" aria-labelledby="co-h">
    <h2 id="co-h"></h2>
    <p class="csub" id="co-sub"></p>
    <p class="linkrow" id="co-doc"></p>
    <div id="tree"></div>
  </section>

</main>

<script>
/* Content comes from config.json (edit it with the admin tool). The copy below
   is the fallback used when config.json cannot be fetched, e.g. file:// preview. */
var DEFAULT_CONFIG = {
  "help": {
    "text": "Information and services for refugees from Ukraine in Moldova.",
    "primary": {
      "label": "Допомога для біженців з України",
      "sub": "UNHCR Help Moldova, in Ukrainian",
      "url": "https://help.unhcr.org/moldova/uk/"
    },
    "secondary": {
      "label": "UNHCR Help Moldova (English)",
      "url": "https://help.unhcr.org/moldova/"
    }
  },
  "calendar": {
    "title": "Coordination calendar",
    "subtitle": "Upcoming coordination meetings and events.",
    "ratio": "1:1",
    "url": "https://docs.google.com/presentation/d/e/2PACX-1vScK7Paq6mfRXN28mPEfotaU3D5B-r979iNP1a-L2NEd-yBO0q70xJg-jbzTh2UwXrGBuLkeqBvi4cu/pub?start=false&loop=false&delayms=3000&slide=id.g29d9704fb09_0_0"
  },
  "structure": {
    "title": "Coordination structure",
    "subtitle": "Select a group to open its page in the portal.",
    "document": {
      "label": "Coordination structure chart (Q1 2026)",
      "url": "https://data.unhcr.org/en/documents/details/120418"
    },
    "query": "?sv=54&geo=10784",
    "groups": [
      {
        "id": 316,
        "name": "Moldova: Refugee Coordination Forum",
        "children": [
          {
            "id": 381,
            "name": "Accountability to Affected People Task Force"
          },
          {
            "id": 386,
            "name": "Local Refugee Coordination Forum"
          }
        ]
      },
      {
        "id": 329,
        "name": "Protection Working Group",
        "children": [
          {
            "id": 336,
            "name": "Child Protection Sub-Sector Working Group"
          },
          {
            "id": 337,
            "name": "Gender-Based Violence (GBV) Sub-Sector Working Group"
          },
          {
            "id": 421,
            "name": "Disability and Age Task Force"
          }
        ]
      },
      {
        "id": 490,
        "name": "Inclusion and Solutions Working Group",
        "children": [
          {
            "id": 319,
            "name": "Basic Needs Technical Working Group"
          },
          {
            "id": 318,
            "name": "Cash Working Group"
          }
        ]
      },
      {
        "id": 333,
        "name": "Health and Nutrition Working Group",
        "children": [
          {
            "id": 400,
            "name": "MHPSS Technical Reference Group"
          }
        ]
      },
      {
        "id": 334,
        "name": "Education Working Group",
        "children": []
      },
      {
        "id": 317,
        "name": "Information Management Working Group",
        "children": []
      }
    ],
    "separate": [
      {
        "id": 502,
        "name": "Moldova: Sergio Vieira de Mello"
      }
    ]
  }
};

(function(){
  var BASE = 'https://data.unhcr.org/en/working-group/';
  var $ = function(id){ return document.getElementById(id); };
  function safeUrl(u){ return /^https:\/\//i.test(u || '') ? u : '#'; }
  function a(href, cls, kids){
    var el = document.createElement('a'); el.className = cls; el.href = safeUrl(href);
    el.target = '_blank'; el.rel = 'noopener'; kids.forEach(function(k){ el.appendChild(k); }); return el;
  }
  function span(text, cls){ var s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s; }
  function arrow(cls){ var e = span('↗', cls); e.setAttribute('aria-hidden','true'); return e; }

  /* Google Slides: "published" link -> embeddable link, and back */
  var SLIDES = /docs\.google\.com\/presentation\/d\/e\//;
  function slidesEmbed(u){ return SLIDES.test(u) ? u.replace(/\/(pub|embed)(\?|$)/, '/embed$2') : u; }
  function slidesOpen(u){ return SLIDES.test(u) ? u.replace(/\/(pub|embed)(\?|$)/, '/pub$2') : u; }

  function render(c){
    var h = c.help || {};
    $('help-text').textContent = h.text || '';
    var btns = $('help-btns'); btns.innerHTML = '';
    if (h.primary && h.primary.url){
      var l = span(h.primary.label); if (h.primary.sub){ var sm = document.createElement('small'); sm.textContent = h.primary.sub; l.appendChild(sm); }
      btns.appendChild(a(h.primary.url, 'btn primary', [l, arrow('arr')]));
    }
    if (h.secondary && h.secondary.url) btns.appendChild(a(h.secondary.url, 'btn secondary', [span(h.secondary.label), arrow('arr')]));

    var cal = c.calendar || {};
    $('cal-h').textContent = cal.title || 'Coordination calendar';
    $('cal-sub').textContent = cal.subtitle || '';
    $('cal-card').hidden = !cal.url;
    var rm = String(cal.ratio || '16:9').split(':'), rw = parseFloat(rm[0]), rh = parseFloat(rm[1]);
    $('cal-card').style.setProperty('--cal-h', (rw > 0 && rh > 0 ? rh / rw : 0.5625).toFixed(4));
    if (cal.url){ var e = slidesEmbed(cal.url); if ($('cal').getAttribute('src') !== e) $('cal').src = e; $('cal-open').href = safeUrl(slidesOpen(cal.url)); }

    var st = c.structure || {}, q = st.query || '';
    $('co-h').textContent = st.title || 'Coordination structure';
    $('co-sub').textContent = st.subtitle || '';
    var doc = $('co-doc'); doc.innerHTML = '';
    if (st.document && st.document.url){ doc.appendChild(a(st.document.url, '', [document.createTextNode(st.document.label + ' ↗')])); doc.style.display = ''; } else doc.style.display = 'none';

    function node(w, cls){ return a(BASE + w.id + q, 'node ' + cls, [span(w.name), arrow('ext')]); }
    var host = $('tree'); host.innerHTML = '';
    var root = document.createElement('ul'); root.className = 'tree';
    (st.groups || []).forEach(function(w, i){
      var li = document.createElement('li'); li.appendChild(node(w, i === 0 ? 'root' : 'wg'));
      if ((w.children || []).length){
        var ul = document.createElement('ul');
        w.children.forEach(function(k){ var l2 = document.createElement('li'); l2.appendChild(node(k, 'sub')); ul.appendChild(l2); });
        li.appendChild(ul);
      }
      root.appendChild(li);
    });
    host.appendChild(root);
    if ((st.separate || []).length){
      var sep = document.createElement('div'); sep.className = 'sep';
      st.separate.forEach(function(w){ sep.appendChild(node(w, 'special')); });
      host.appendChild(sep);
    }
  }

  render(DEFAULT_CONFIG);
  if (location.protocol !== 'file:'){
    fetch('config.json', {cache:'no-cache'}).then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(render).catch(function(){ /* keep fallback */ });
  }
})();
</script>
</body>
</html>
